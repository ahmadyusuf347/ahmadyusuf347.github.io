<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galery Rifnida</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .navbar-brand {
            justify-items: center;
            text-align: center;
        }

        .gallery-container {
            padding: 80px 0;
        }

        .carousel-item img {
            width: 250px;
            height: 350px;
            object-fit: cover;
            margin: auto;
        }

        .gallery-scroll {
            overflow-x: auto;
            white-space: nowrap;
            padding-top: 30px;
        }

        .gallery-scroll img {
            height: 180px;
            margin-right: 15px;
            object-fit: cover;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .gallery-scroll img:hover {
            transform: scale(1.05);
        }

        .info-text {
            font-size: 12px;
            margin-bottom: 20px;
        }

        footer {
            font-size: 12px;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-transparent px-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">NIDA GALERY</a>
    </div>
</nav>

<!-- Content -->
<div class="container gallery-container text-center">

    <!-- Info -->
    <div class="info-text">
        <strong>ROLL</strong><br>
        EXPLORE FROM<br>
        FASHION, DESIGN, THE<br>
        ARCHIVE, SINCE 2018
    </div>

    <!-- Slideshow -->
    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/rifnida/1.jpeg">
            </div>
            <div class="carousel-item">
                <img src="/rifnida/2.jpeg">
            </div>
            <div class="carousel-item">
                <img src="/rifnida/3.jpeg">
            </div>
            <div class="carousel-item">
                <img src="/rifnida/4.jpeg">
            </div>
            <div class="carousel-item">
                <img src="/rifnida/5.jpeg">
            </div>
            <div class="carousel-item">
                <img src="/rifnida/6.jpeg">
            </div>
        </div>
    </div>

    <!-- Gallery bawah -->
    <div class="gallery-scroll mt-4">
        <img src="/rifnida/10.jpeg">
        <img src="/rifnida/11.jpeg">
        <img src="/rifnida/12.jpeg">
        <img src="/rifnida/13.jpeg">
        <img src="/rifnida/14.jpeg">
        <img src="/rifnida/15.jpeg">
    </div>

</div>

<!-- Footer -->
<footer class="text-center">
    <div>MY STUDIO</div>
    <div>(INDEX)</div>
    <div class="mt-2">
        EXPLORE MORE<br>
        COLLECTION, EXPLORE THE<br>
        ARCHIVE, LIMITED
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
